# ============================================================
# Azure DevOps Pipeline – IAC_AZURE_AUTOMATION_PIPELINE
# Trigger: push / PR to main branch of the GitHub repo
# Stages: Validate → Plan → Apply (gated on main)
# Uses only built-in ADO tasks – no marketplace extensions required.
# ============================================================

trigger:
  branches:
    include:
      - main
      - develop
  paths:
    include:
      - "**/*.tf"
      - "**/*.tfvars"
      - ".azuredevops/terraform-pipeline.yml"

pr:
  branches:
    include:
      - main
  paths:
    include:
      - "**/*.tf"
      - "**/*.tfvars"

# ── Variables ─────────────────────────────────────────────────────────────────
variables:
  # Pull ARM_*, TF_BACKEND_*, and SSH_PUBLIC_KEY from the variable group
  - group: terraform-backend

  # Azure service connection (Project Settings → Service Connections)
  - name: AZURE_SERVICE_CONNECTION
    value: "azure-service-connection"

  # Terraform version
  - name: TF_VERSION
    value: "1.9.8"

  # Working directory inside the repo
  - name: TF_WORKING_DIR
    value: "$(System.DefaultWorkingDirectory)"

  # Backend config – values come from the variable group above
  - name: BACKEND_RESOURCE_GROUP
    value: "$(TF_BACKEND_RG)"
  - name: BACKEND_STORAGE_ACCOUNT
    value: "$(TF_BACKEND_SA)"
  - name: BACKEND_CONTAINER
    value: "$(TF_BACKEND_CONTAINER)"
  - name: BACKEND_KEY
    value: "IAC_azure_automation_pipeline/terraform.tfstate"

  # SSH key – leave blank to use auto-generated password auth
  - name: TF_VAR_ssh_public_key
    value: "$(SSH_PUBLIC_KEY)"

# ── Pool ──────────────────────────────────────────────────────────────────────
pool:
  vmImage: "ubuntu-latest"

# ── Shared step template: install Terraform ───────────────────────────────────
# Referenced in each stage via a bash step (no marketplace extension needed).

# ── Stages ────────────────────────────────────────────────────────────────────
stages:

  # ── Stage 1: Validate ───────────────────────────────────────────────────────
  - stage: Validate
    displayName: "Terraform Validate"
    jobs:
      - job: TerraformValidate
        displayName: "fmt + validate"
        steps:

          - checkout: self
            displayName: "Checkout source from GitHub"
            fetchDepth: 0

          # Install Terraform from HashiCorp releases (no marketplace needed)
          - bash: |
              set -euo pipefail
              echo "Installing Terraform $(TF_VERSION)..."
              curl -fsSL "https://releases.hashicorp.com/terraform/$(TF_VERSION)/terraform_$(TF_VERSION)_linux_amd64.zip" \
                -o /tmp/terraform.zip
              unzip -o /tmp/terraform.zip -d /tmp
              sudo mv /tmp/terraform /usr/local/bin/terraform
              terraform version
            displayName: "Install Terraform $(TF_VERSION)"

          # terraform init + fmt + validate via AzureCLI@2 (built-in)
          - task: AzureCLI@2
            displayName: "terraform init + fmt + validate"
            inputs:
              azureSubscription: "$(AZURE_SERVICE_CONNECTION)"
              scriptType: "bash"
              scriptLocation: "inlineScript"
              addSpnToEnvironment: true
              inlineScript: |
                set -euo pipefail
                export ARM_CLIENT_ID=$servicePrincipalId
                export ARM_CLIENT_SECRET=$servicePrincipalKey
                export ARM_SUBSCRIPTION_ID=$(ARM_SUBSCRIPTION_ID)
                export ARM_TENANT_ID=$(ARM_TENANT_ID)

                cd "$(TF_WORKING_DIR)"

                echo "--- terraform init ---"
                terraform init \
                  -backend-config="resource_group_name=$(BACKEND_RESOURCE_GROUP)" \
                  -backend-config="storage_account_name=$(BACKEND_STORAGE_ACCOUNT)" \
                  -backend-config="container_name=$(BACKEND_CONTAINER)" \
                  -backend-config="key=$(BACKEND_KEY)"

                echo "--- terraform fmt ---"
                terraform fmt -check -recursive -diff

                echo "--- terraform validate ---"
                terraform validate

  # ── Stage 2: Plan ────────────────────────────────────────────────────────────
  - stage: Plan
    displayName: "Terraform Plan"
    dependsOn: Validate
    condition: succeeded()
    jobs:
      - job: TerraformPlan
        displayName: "terraform plan"
        steps:

          - checkout: self
            displayName: "Checkout source from GitHub"
            fetchDepth: 0

          - bash: |
              set -euo pipefail
              echo "Installing Terraform $(TF_VERSION)..."
              curl -fsSL "https://releases.hashicorp.com/terraform/$(TF_VERSION)/terraform_$(TF_VERSION)_linux_amd64.zip" \
                -o /tmp/terraform.zip
              unzip -o /tmp/terraform.zip -d /tmp
              sudo mv /tmp/terraform /usr/local/bin/terraform
              terraform version
            displayName: "Install Terraform $(TF_VERSION)"

          - task: AzureCLI@2
            displayName: "terraform init + plan"
            inputs:
              azureSubscription: "$(AZURE_SERVICE_CONNECTION)"
              scriptType: "bash"
              scriptLocation: "inlineScript"
              addSpnToEnvironment: true
              inlineScript: |
                set -euo pipefail
                export ARM_CLIENT_ID=$servicePrincipalId
                export ARM_CLIENT_SECRET=$servicePrincipalKey
                export ARM_SUBSCRIPTION_ID=$(ARM_SUBSCRIPTION_ID)
                export ARM_TENANT_ID=$(ARM_TENANT_ID)

                cd "$(TF_WORKING_DIR)"

                echo "--- terraform init ---"
                terraform init \
                  -backend-config="resource_group_name=$(BACKEND_RESOURCE_GROUP)" \
                  -backend-config="storage_account_name=$(BACKEND_STORAGE_ACCOUNT)" \
                  -backend-config="container_name=$(BACKEND_CONTAINER)" \
                  -backend-config="key=$(BACKEND_KEY)"

                echo "--- terraform plan ---"
                # -detailed-exitcode: 0=no changes, 1=error, 2=changes present
                terraform plan \
                  -out="$(Pipeline.Workspace)/tfplan" \
                  -var="ssh_public_key=$(TF_VAR_ssh_public_key)" \
                  -detailed-exitcode || PLAN_EXIT=$?

                # Exit code 2 means "changes to apply" – not an error
                if [ "${PLAN_EXIT:-0}" -eq 2 ]; then
                  echo "Plan has changes. Proceeding."
                elif [ "${PLAN_EXIT:-0}" -eq 1 ]; then
                  echo "Plan failed." && exit 1
                fi

                echo "--- terraform show (human-readable summary) ---"
                terraform show -no-color "$(Pipeline.Workspace)/tfplan" \
                  | tee "$(Pipeline.Workspace)/tfplan.txt"
                echo "##vso[task.uploadsummary]$(Pipeline.Workspace)/tfplan.txt"

          # Publish plan binary as pipeline artifact for the Apply stage
          - task: PublishPipelineArtifact@1
            displayName: "Publish plan artifact"
            inputs:
              targetPath: "$(Pipeline.Workspace)/tfplan"
              artifact: "tfplan"
              publishLocation: "pipeline"

  # ── Stage 3: Apply (manual approval gate on main) ─────────────────────────
  - stage: Apply
    displayName: "Terraform Apply"
    dependsOn: Plan
    # Only auto-run on main; feature/develop branches stop after Plan
    condition: |
      and(
        succeeded(),
        eq(variables['Build.SourceBranch'], 'refs/heads/main')
      )
    jobs:
      # The 'production' environment has an Approvals check configured –
      # the pipeline pauses here until a reviewer approves.
      - deployment: TerraformApply
        displayName: "terraform apply"
        environment: "production"
        strategy:
          runOnce:
            deploy:
              steps:

                - checkout: self
                  displayName: "Checkout source from GitHub"
                  fetchDepth: 0

                - bash: |
                    set -euo pipefail
                    echo "Installing Terraform $(TF_VERSION)..."
                    curl -fsSL "https://releases.hashicorp.com/terraform/$(TF_VERSION)/terraform_$(TF_VERSION)_linux_amd64.zip" \
                      -o /tmp/terraform.zip
                    unzip -o /tmp/terraform.zip -d /tmp
                    sudo mv /tmp/terraform /usr/local/bin/terraform
                    terraform version
                  displayName: "Install Terraform $(TF_VERSION)"

                # Download plan artifact produced by the Plan stage
                - task: DownloadPipelineArtifact@2
                  displayName: "Download plan artifact"
                  inputs:
                    artifact: "tfplan"
                    path: "$(Pipeline.Workspace)/tfplan"

                - task: AzureCLI@2
                  displayName: "terraform init + apply"
                  inputs:
                    azureSubscription: "$(AZURE_SERVICE_CONNECTION)"
                    scriptType: "bash"
                    scriptLocation: "inlineScript"
                    addSpnToEnvironment: true
                    inlineScript: |
                      set -euo pipefail
                      export ARM_CLIENT_ID=$servicePrincipalId
                      export ARM_CLIENT_SECRET=$servicePrincipalKey
                      export ARM_SUBSCRIPTION_ID=$(ARM_SUBSCRIPTION_ID)
                      export ARM_TENANT_ID=$(ARM_TENANT_ID)

                      cd "$(TF_WORKING_DIR)"

                      echo "--- terraform init ---"
                      terraform init \
                        -backend-config="resource_group_name=$(BACKEND_RESOURCE_GROUP)" \
                        -backend-config="storage_account_name=$(BACKEND_STORAGE_ACCOUNT)" \
                        -backend-config="container_name=$(BACKEND_CONTAINER)" \
                        -backend-config="key=$(BACKEND_KEY)"

                      echo "--- terraform apply ---"
                      terraform apply -auto-approve "$(Pipeline.Workspace)/tfplan/tfplan"

                      echo ""
                      echo "=== Terraform Outputs ==="
                      terraform output -json
