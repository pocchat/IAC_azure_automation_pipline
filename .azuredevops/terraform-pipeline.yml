# ============================================================
# Azure DevOps Pipeline – IAC_AZURE_AUTOMATION_PIPELINE
# Trigger: push / PR to main branch of the GitHub repo
# Stages: Validate → Plan → Apply (gated on main)
# Uses only built-in ADO tasks – no marketplace extensions required.
# Compatible with both Linux (Microsoft-hosted) and Windows (self-hosted) agents.
# ============================================================

trigger:
  branches:
    include:
      - main
      - develop
  paths:
    include:
      - "**/*.tf"
      - "**/*.tfvars"
      - ".azuredevops/terraform-pipeline.yml"

pr:
  branches:
    include:
      - main
  paths:
    include:
      - "**/*.tf"
      - "**/*.tfvars"

# ── Variables ─────────────────────────────────────────────────────────────────
variables:
  # Pull ARM_*, TF_BACKEND_*, and SSH_PUBLIC_KEY from the variable group
  - group: terraform-backend

  # Azure service connection (Project Settings → Service Connections)
  - name: AZURE_SERVICE_CONNECTION
    value: "azure-service-connection"

  # Terraform version
  - name: TF_VERSION
    value: "1.9.8"

  # Working directory inside the repo
  - name: TF_WORKING_DIR
    value: "$(System.DefaultWorkingDirectory)"

  # Backend config – values come from the variable group above
  - name: BACKEND_RESOURCE_GROUP
    value: "$(TF_BACKEND_RG)"
  - name: BACKEND_STORAGE_ACCOUNT
    value: "$(TF_BACKEND_SA)"
  - name: BACKEND_CONTAINER
    value: "$(TF_BACKEND_CONTAINER)"
  - name: BACKEND_KEY
    value: "IAC_azure_automation_pipeline/terraform.tfstate"

  # SSH key – leave blank to use auto-generated password auth
  - name: TF_VAR_ssh_public_key
    value: "$(SSH_PUBLIC_KEY)"

# ── Pool ──────────────────────────────────────────────────────────────────────
# Uses the 'Default' pool which maps to the self-hosted agent (win-local-agent).
# To switch back to Microsoft-hosted runners (requires purchased parallelism),
# replace the pool block with:  pool: { vmImage: "ubuntu-latest" }
pool:
  name: "Default"

# ── Stages ────────────────────────────────────────────────────────────────────
stages:

  # ── Stage 1: Validate ───────────────────────────────────────────────────────
  - stage: Validate
    displayName: "Terraform Validate"
    jobs:
      - job: TerraformValidate
        displayName: "fmt + validate"
        steps:

          - checkout: self
            displayName: "Checkout source from GitHub"
            fetchDepth: 0

          # Install Terraform – works on both Linux and Windows (Git Bash)
          - bash: |
              set -euo pipefail
              TF_VER="$(TF_VERSION)"
              TF_DIR="$HOME/.terraform-bin"
              mkdir -p "$TF_DIR"

              # Pick the right platform zip
              if [[ "$OSTYPE" == msys* || "$OSTYPE" == cygwin* || "$OS" == "Windows_NT" ]]; then
                PLATFORM="windows_amd64"; EXT=".exe"
              else
                PLATFORM="linux_amd64"; EXT=""
              fi

              echo "Installing Terraform $TF_VER for $PLATFORM..."
              curl -fsSL \
                "https://releases.hashicorp.com/terraform/${TF_VER}/terraform_${TF_VER}_${PLATFORM}.zip" \
                -o "$TF_DIR/terraform.zip"
              unzip -o "$TF_DIR/terraform.zip" -d "$TF_DIR"
              echo "##vso[task.prependpath]$TF_DIR"
              "$TF_DIR/terraform${EXT}" version
            displayName: "Install Terraform $(TF_VERSION)"

          # terraform init + fmt + validate via AzureCLI@2 (built-in)
          - task: AzureCLI@2
            displayName: "terraform init + fmt + validate"
            inputs:
              azureSubscription: "$(AZURE_SERVICE_CONNECTION)"
              scriptType: "bash"
              scriptLocation: "inlineScript"
              addSpnToEnvironment: true
              inlineScript: |
                set -euo pipefail
                export ARM_CLIENT_ID=$servicePrincipalId
                export ARM_CLIENT_SECRET=$servicePrincipalKey
                export ARM_SUBSCRIPTION_ID=$(ARM_SUBSCRIPTION_ID)
                export ARM_TENANT_ID=$(ARM_TENANT_ID)

                # Ensure terraform is on PATH (set by previous step)
                TF_DIR="$HOME/.terraform-bin"
                export PATH="$TF_DIR:$PATH"

                cd "$(TF_WORKING_DIR)"

                echo "--- terraform init ---"
                terraform init \
                  -backend-config="resource_group_name=$(BACKEND_RESOURCE_GROUP)" \
                  -backend-config="storage_account_name=$(BACKEND_STORAGE_ACCOUNT)" \
                  -backend-config="container_name=$(BACKEND_CONTAINER)" \
                  -backend-config="key=$(BACKEND_KEY)"

                echo "--- terraform fmt ---"
                terraform fmt -check -recursive -diff

                echo "--- terraform validate ---"
                terraform validate

  # ── Stage 2: Plan ────────────────────────────────────────────────────────────
  - stage: Plan
    displayName: "Terraform Plan"
    dependsOn: Validate
    condition: succeeded()
    jobs:
      - job: TerraformPlan
        displayName: "terraform plan"
        steps:

          - checkout: self
            displayName: "Checkout source from GitHub"
            fetchDepth: 0

          - bash: |
              set -euo pipefail
              TF_VER="$(TF_VERSION)"
              TF_DIR="$HOME/.terraform-bin"
              mkdir -p "$TF_DIR"

              if [[ "$OSTYPE" == msys* || "$OSTYPE" == cygwin* || "$OS" == "Windows_NT" ]]; then
                PLATFORM="windows_amd64"; EXT=".exe"
              else
                PLATFORM="linux_amd64"; EXT=""
              fi

              echo "Installing Terraform $TF_VER for $PLATFORM..."
              curl -fsSL \
                "https://releases.hashicorp.com/terraform/${TF_VER}/terraform_${TF_VER}_${PLATFORM}.zip" \
                -o "$TF_DIR/terraform.zip"
              unzip -o "$TF_DIR/terraform.zip" -d "$TF_DIR"
              echo "##vso[task.prependpath]$TF_DIR"
              "$TF_DIR/terraform${EXT}" version
            displayName: "Install Terraform $(TF_VERSION)"

          - task: AzureCLI@2
            displayName: "terraform init + plan"
            inputs:
              azureSubscription: "$(AZURE_SERVICE_CONNECTION)"
              scriptType: "bash"
              scriptLocation: "inlineScript"
              addSpnToEnvironment: true
              inlineScript: |
                set -euo pipefail
                export ARM_CLIENT_ID=$servicePrincipalId
                export ARM_CLIENT_SECRET=$servicePrincipalKey
                export ARM_SUBSCRIPTION_ID=$(ARM_SUBSCRIPTION_ID)
                export ARM_TENANT_ID=$(ARM_TENANT_ID)

                TF_DIR="$HOME/.terraform-bin"
                export PATH="$TF_DIR:$PATH"

                PLAN_OUT="$(Pipeline.Workspace)/tfplan"
                mkdir -p "$PLAN_OUT"

                cd "$(TF_WORKING_DIR)"

                echo "--- terraform init ---"
                terraform init \
                  -backend-config="resource_group_name=$(BACKEND_RESOURCE_GROUP)" \
                  -backend-config="storage_account_name=$(BACKEND_STORAGE_ACCOUNT)" \
                  -backend-config="container_name=$(BACKEND_CONTAINER)" \
                  -backend-config="key=$(BACKEND_KEY)"

                echo "--- terraform plan ---"
                terraform plan \
                  -out="$PLAN_OUT/tfplan" \
                  -var="ssh_public_key=$(TF_VAR_ssh_public_key)" \
                  -detailed-exitcode || PLAN_EXIT=$?

                if [ "${PLAN_EXIT:-0}" -eq 2 ]; then
                  echo "Plan has changes – proceeding."
                elif [ "${PLAN_EXIT:-0}" -eq 1 ]; then
                  echo "Plan failed." && exit 1
                fi

                echo "--- plan summary ---"
                terraform show -no-color "$PLAN_OUT/tfplan" \
                  | tee "$PLAN_OUT/tfplan.txt"
                echo "##vso[task.uploadsummary]$PLAN_OUT/tfplan.txt"

          # Publish plan binary so Apply stage can download it
          - task: PublishPipelineArtifact@1
            displayName: "Publish plan artifact"
            inputs:
              targetPath: "$(Pipeline.Workspace)/tfplan"
              artifact: "tfplan"
              publishLocation: "pipeline"

  # ── Stage 3: Apply (manual approval gate on main) ─────────────────────────
  - stage: Apply
    displayName: "Terraform Apply"
    dependsOn: Plan
    # Only run on main branch; feature/develop branches stop after Plan
    condition: |
      and(
        succeeded(),
        eq(variables['Build.SourceBranch'], 'refs/heads/main')
      )
    jobs:
      # 'production' environment has Approvals check configured –
      # pipeline pauses here until a reviewer approves in ADO.
      - deployment: TerraformApply
        displayName: "terraform apply"
        environment: "production"
        strategy:
          runOnce:
            deploy:
              steps:

                - checkout: self
                  displayName: "Checkout source from GitHub"
                  fetchDepth: 0

                - bash: |
                    set -euo pipefail
                    TF_VER="$(TF_VERSION)"
                    TF_DIR="$HOME/.terraform-bin"
                    mkdir -p "$TF_DIR"

                    if [[ "$OSTYPE" == msys* || "$OSTYPE" == cygwin* || "$OS" == "Windows_NT" ]]; then
                      PLATFORM="windows_amd64"; EXT=".exe"
                    else
                      PLATFORM="linux_amd64"; EXT=""
                    fi

                    echo "Installing Terraform $TF_VER for $PLATFORM..."
                    curl -fsSL \
                      "https://releases.hashicorp.com/terraform/${TF_VER}/terraform_${TF_VER}_${PLATFORM}.zip" \
                      -o "$TF_DIR/terraform.zip"
                    unzip -o "$TF_DIR/terraform.zip" -d "$TF_DIR"
                    echo "##vso[task.prependpath]$TF_DIR"
                    "$TF_DIR/terraform${EXT}" version
                  displayName: "Install Terraform $(TF_VERSION)"

                # Download plan artifact from the Plan stage
                - task: DownloadPipelineArtifact@2
                  displayName: "Download plan artifact"
                  inputs:
                    artifact: "tfplan"
                    path: "$(Pipeline.Workspace)/tfplan"

                - task: AzureCLI@2
                  displayName: "terraform init + apply"
                  inputs:
                    azureSubscription: "$(AZURE_SERVICE_CONNECTION)"
                    scriptType: "bash"
                    scriptLocation: "inlineScript"
                    addSpnToEnvironment: true
                    inlineScript: |
                      set -euo pipefail
                      export ARM_CLIENT_ID=$servicePrincipalId
                      export ARM_CLIENT_SECRET=$servicePrincipalKey
                      export ARM_SUBSCRIPTION_ID=$(ARM_SUBSCRIPTION_ID)
                      export ARM_TENANT_ID=$(ARM_TENANT_ID)

                      TF_DIR="$HOME/.terraform-bin"
                      export PATH="$TF_DIR:$PATH"

                      cd "$(TF_WORKING_DIR)"

                      echo "--- terraform init ---"
                      terraform init \
                        -backend-config="resource_group_name=$(BACKEND_RESOURCE_GROUP)" \
                        -backend-config="storage_account_name=$(BACKEND_STORAGE_ACCOUNT)" \
                        -backend-config="container_name=$(BACKEND_CONTAINER)" \
                        -backend-config="key=$(BACKEND_KEY)"

                      echo "--- terraform apply ---"
                      terraform apply -auto-approve \
                        "$(Pipeline.Workspace)/tfplan/tfplan"

                      echo ""
                      echo "=== Terraform Outputs ==="
                      terraform output -json
